<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes de seguridad</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/comun.css">
  <link rel="stylesheet" href="css/inicio.css">
</head>
<body>
  <main class="entrada">
    <div class="tarjeta caja-entrada">
      <img src="img/logo.png" alt="" class="logo-entrada">
      <h1>🦺 Reportes de seguridad</h1>
      <p class="sub">Entra con tu usuario y código de la app <b>NOMINAS 2027</b>.</p>
      <label class="etiqueta" for="acceso">Usuario</label>
      <input id="acceso" class="campo" autocomplete="username" autocapitalize="none" placeholder="Tu usuario o correo">
      <label class="etiqueta" for="codigo">Código</label>
      <input id="codigo" class="campo" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Tu código">
      <button id="entrar" class="boton grande" type="button">Entrar</button>
      <div id="msg"></div>
    </div>
  </main>
  <footer class="pie"></footer>
  <script src="config.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
